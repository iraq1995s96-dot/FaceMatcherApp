name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        export DEBIAN_FRONTEND=noninteractive
        
        sudo -E apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev lib32z1 lib32ncurses6 lib32stdc++6
        
        sudo -E apt-get install -y libtinfo5 || true
        
        pip install --upgrade pip
        pip install buildozer virtualenv

    - name: Clear Buildozer Cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Build with Buildozer
      run: |
        # أمر yes | سيقوم بالضغط على Y تلقائياً للموافقة على التراخيص
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
