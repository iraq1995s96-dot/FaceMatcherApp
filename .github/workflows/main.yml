name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من صفحة GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # إصدار مستقر جداً مع Buildozer

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # ضروري جداً لإصدارات Android SDK الحديثة

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        
        # هذا السطر يمنع النظام من التوقف وانتظار موافقة (Y/n) وبالتالي يمنع التعليق
        export DEBIAN_FRONTEND=noninteractive
        
        sudo -E apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev lib32z1 lib32ncurses6 lib32stdc++6
        
        # محاولة تثبيت libtinfo5، وإذا فشلت يكمل البناء بدون توقف
        sudo -E apt-get install -y libtinfo5 || true
        
        # تثبيت Buildozer وإصدار مستقر من Cython
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv

    - name: Clear Buildozer Cache
      run: |
        # مسح الكاش لمنع الأخطاء المتكررة من المحاولات السابقة
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        # قبول تراخيص جوجل تلقائياً
        yes | sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        # تشغيل البناء مع طباعة تفاصيل الأخطاء
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
